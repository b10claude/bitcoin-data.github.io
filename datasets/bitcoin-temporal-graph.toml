name = "BitcoinTemporalGraph"
category = "transactions"
tags = ["transactions", "addresses", "timestamps", "machine-learning", "mainnet"]
format = ["binary", "csv"]
author = "Hugo Schnoering and Michalis Vazirgiannis (LIX, École Polytechnique)"
license = "CC BY 4.0"
doi = "10.6084/m9.figshare.26305093"
description = """
A temporal directed graph of value transfers between clustered Bitcoin entities
as a PostgreSQL dump, with per-entity degree, amount and cluster statistics and
per-pair transfer counts and block heights. Built by the authors from the
blockchain with address clustering and published alongside graph-learning
baselines. A companion CSV labels addresses with an entity name and type, but
those labels are scraped from forum posts and are weaker than the graph.
"""

