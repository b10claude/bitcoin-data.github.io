name = "Bitcoin Core P2P traffic breakdown"
category = "p2p-network"
tags = ["p2p", "nodes", "bitcoin-core", "mainnet"]
format = ["csv"]
author = "virtu"
license = "MIT"
description = """
Hourly and daily estimates of a Bitcoin Core node's TCP/IP traffic as
bzip2-compressed CSV, split by message type, connection type and peer, plus
inbound and outbound traffic per peer.observer node. virtu derived them from
Bitcoin Core's net message tracepoints by adding P2P header and TCP/IP overhead
to payload sizes, validated against systemd IP accounting. Useful for gauging
bandwidth savings of proposals such as Erlay; the figures are single-node
estimates and the per-peer files include peer IP addresses.
"""

