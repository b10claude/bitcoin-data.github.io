description = """
Daily aggregates behind the BitcoinVisuals charts, one CSV row per day with
columns for blocks, block size and weight, transaction counts, fees, input and
output values, mempool state, market prices and Lightning Network topology.
Chain and Lightning columns come from the project's own Bitcoin Core and lnd
nodes, price columns from third parties. Handy for quick daily time series;
chain columns are per-block medians or sums, not raw values.
"""

