name = "Transaction graph dataset for the Bitcoin blockchain"
category = "transactions"
tags = ["transactions", "addresses", "blocks", "timestamps", "mainnet"]
format = ["text"]
author = "Can Özturan, Alper Şen and Baran Kılıç (Bogazici University)"
license = "CC BY 4.0"
doi = "10.5281/zenodo.7157355"
description = """
Bitcoin transfers as graph edges, one text line per transfer with a BTC-IN or
BTC-OUT marker, block number, position in the block, source, destination and
amount, plus a file mapping block numbers to timestamps. Extracted from the
mainnet blockchain at Bogazici University for work on fraud detection in
transaction graphs. Useful for large-scale graph analysis; the block ranges are
split across several Zenodo records of bzip2 archives fetched separately.
"""

