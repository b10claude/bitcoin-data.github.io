name = "Erlay evaluation data"
category = "p2p-network"
tags = ["p2p", "propagation", "transactions", "topology", "simulation"]
format = ["text"]
author = "Gleb Naumenko"
license = "Not specified"
description = """
Lines of whitespace-separated integers, one per simulated node, giving its
peers and the transactions it lacks under flooding and under Erlay at several
connection counts. Gleb Naumenko generated them with a Bitcoin simulator as
the evaluation data behind the Erlay paper, plus inputs for a block relay
topology inference experiment. Scripts in the repository replay the paper's
propagation analysis; these are simulator outputs rather than observations of
the real network.
"""

