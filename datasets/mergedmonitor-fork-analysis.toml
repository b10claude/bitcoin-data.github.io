name = "Merged mining fork analysis"
category = "blocks"
tags = ["blocks", "forks", "mining", "mainnet"]
format = ["json", "binary"]
author = "Nicholas Stifter, Philipp Schindler, Aljosha Judmayer, Alexei Zamyatin, Andreas Kern and Edgar Weippl"
license = "Not specified"
description = """
JSON lists of Bitcoin blocks tagged with merge-mined child chains,
difficulty epochs, stale blocks recovered from Namecoin merged-mining data, and
stale block snapshots from fork monitors and explorers. Compiled by
Stifter et al. for the paper Echoes of the Past from coin clients, the KIT and
Decker-Wattenhofer monitors and explorer APIs, with a Litecoin counterpart.
Useful for comparing live fork monitoring with merged-mining stale block
recovery; the release is partial and large files are tarballs.
"""

