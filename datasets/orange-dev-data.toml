name = "Orange Dev data"
category = "development"
tags = ["bitcoin-core", "bips", "code-review", "github", "pull-requests", "releases"]
format = ["parquet", "json"]
author = "Bitcoin Data Labs"
license = "CC BY 4.0 (data), BSD-2-Clause (code); quoted third-party text keeps its own terms"
description = """
Parquet and JSON on Bitcoin development: a contributor registry with per-person
commit and review counts, code review network graphs, release and meeting
summaries, and a cross-reference from pull requests to Optech newsletters.
Bitcoin Data Labs builds them with a pipeline over git history, GitHub, the BIPs
repository, the mailing list and Delving Bitcoin. Useful for contributor and
review metrics; the release and meeting summaries are language-model text, not
primary records.
"""

