name = "Ransomware payments in the Bitcoin ecosystem"
category = "transactions"
tags = ["addresses", "transactions", "ransomware", "forensics", "mainnet"]
format = ["csv"]
author = "Masarah Paquet-Clouston, Bernhard Haslhofer and Benoit Dupont"
license = "CC BY 4.0"
doi = "10.5281/zenodo.1238040"
description = """
Addresses and payments tied to ransomware families, as CSV tables of per-family
seed addresses, collector addresses with their multi-input cluster id, and the
transactions paying them with hash, timestamp and value. Produced by the
authors on the GraphSense platform, which expands the seed addresses into
clusters and follows their payments. Useful for estimating ransom revenue per
family; the figures are a lower bound and the clustering can merge unrelated
users.
"""

