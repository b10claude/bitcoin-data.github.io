name = "Unindexed Bitcoin transaction chunks for UTXO output classification"
category = "transactions"
tags = ["transactions", "blocks", "bitcoin-core", "mainnet"]
format = ["csv"]
author = "David Melo, Saul E. Pomares-Hernandez, Lil María Rodríguez-Henríquez and Julio César Pérez-Sansalvador (INAOE)"
license = "CC0 1.0"
doi = "10.7910/DVN/XJWJ0O"
description = """
One CSV row per transaction output, giving the transaction id, output index,
amount, scriptPubKey, block height, transaction size and a storage class label.
Extracted at INAOE from Bitcoin Core's chainstate for the Mech-Scal storage
scalability work, which sorts outputs into immutable, low-churn and high-churn
classes. Useful as input for output classification work; the chunks are a fixed
snapshot split across several deposits and hold CSV text despite a .bin
extension.
"""

