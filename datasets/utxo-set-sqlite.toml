name = "Bitcoin UTXO chainstate and transaction tables"
category = "transactions"
tags = ["transactions", "blocks", "bitcoin-core", "coinbase", "mainnet"]
format = ["sqlite", "csv"]
author = "David Melo, Lil María Rodríguez-Henríquez, Saúl E. Pomares-Hernández and Julio César Pérez-Sansalvador (INAOE)"
license = "CC0 1.0 (data), MIT (code)"
doi = "10.7910/DVN/5CNTNF"
description = """
The unspent output set as a SQLite table, one row per output with txid, index,
value, script type, height and coinbase flag, plus a CSV table of one row per
transaction with sizes, input and output counts and input txids. Extracted at
INAOE from Bitcoin Core, the output table read from its LevelDB chainstate.
Useful for storage-scalability work; both tables are fixed snapshots split into
parts that must be rejoined.
"""

