name = "WatchYourBack address tags"
category = "transactions"
tags = ["addresses", "attribution", "privacy", "channels", "mainnet"]
format = ["csv"]
author = "Gibran Gomez, Pedro Moreno-Sanchez and Juan Caballero (IMDEA Software Institute)"
license = "GPL-3.0; aggregated third-party tags carry their own terms"
description = """
One row per Bitcoin address in headerless CSV files, with a currency ticker, a
category, an owner tag, an optional subtype and a reference URL. Collected by
the IMDEA Software Institute authors of WatchYourBack, largely by aggregating
third-party tag sources, explorers and abuse reports. Useful for labelling
exchange and malware addresses during graph exploration; one file tags
Lightning channel funding addresses, and tag quality depends on the original
reporter.
"""

